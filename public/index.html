<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شجرة عائلة علي وحسنية</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#b08d3c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/artifact-base.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="gate" class="gate"></div>
<main id="appmain" hidden>
<div id="ubar"><span id="uname"></span><button id="inst" hidden>📲 ثبّت التطبيق</button><button id="uout">خروج</button></div>
<button id="fs" aria-label="تكبير الخط">أ+</button>
<h1>شجرة عائلة علي وحسنية</h1>
<div class="orn"><i></i><b></b><i></i></div>
<div class="sub">اختر قسمًا من الأقسام أدناه</div>
<button id="ev" class="evb"></button><div id="evl" class="evl"></div>
<div class="dua" id="dua"></div>
<div class="grid" id="grid">
<button id="famb" class="tile" style="--t:#e8557a"><i>👨‍👩‍👧‍👦</i><b>الأسرة</b><small>علي وحسنية وفروعهم</small></button>
<button id="pb0" class="tile" style="--t:#2fa36b"><i>🌳</i><b>الشجرة المصمَّمة</b><small>للتأطير والمشاركة</small></button>
<button id="tlb" class="tile" style="--t:#3b82d6"><i>📜</i><b>الخط الزمني</b><small>من ١٩٦٠ إلى اليوم</small></button>
<button id="tmb" class="tile" style="--t:#8a5cf0"><i>⏳</i><b>آلة الزمن</b><small>من كان موجودًا؟</small></button>
<button id="ctb" class="tile" style="--t:#f08a1c"><i>📍</i><b>أين نسكن؟</b><small>المدن والدول</small></button>
<button id="cdb" class="tile" style="--t:#14a3a3"><i>🎁</i><b>بطاقات التهنئة</b><small>ميلاد، زواج، أعياد</small></button>
<button id="hkb" class="tile" style="--t:#e6a100"><i>📖</i><b>هكذا علمتني الحياة</b><small>من دفتر الوالد علي — حفظه الله</small></button>
<button id="slb" class="tile" style="--t:#ec4899"><i>🤝</i><b>صلة اليوم</b><small id="slt">اتصل ببيت من العائلة</small></button>
<button id="khb" class="tile" style="--t:#65a30d"><i>📿</i><b>ختمة العائلة</b><small>توزيع أجزاء المصحف</small></button>
<button id="ntb" class="tile" style="--t:#d9467a"><i>🔔</i><b>الإشعارات</b><small>مناسبات وختمة ومواعيد</small></button>
<button id="gtb" class="tile" style="--t:#0ea5e9"><i>🗓️</i><b>موعد عائلي</b><small>زيارة أو مكالمة جماعية</small></button>
<button id="apb" class="tile" style="--t:#6366f1" hidden><i>🛡️</i><b>اعتماد الأعضاء</b><small>للمالك فقط</small></button>
</div>
<div id="fam" class="tl">
<div class="root">
<div class="p" id="pa">علي<small>الأب</small></div>
<div class="p" id="pm">حسنية<small>الأم</small></div>
</div>
<div class="mar" id="pmar"></div>
<div class="stem"></div>
<div id="list"></div>
<div class="hint" id="famhint"></div>
</div>
<div id="pp" class="tl"><img id="pimg" alt="شجرة العائلة المصمَّمة"><div class="pb"><button id="ppdf">حفظ PDF للطباعة (A3)</button><button id="ppng">حفظ صورة للمشاركة</button></div><div class="dt" id="phint"></div></div>
<div id="tl" class="tl"></div>
<div id="tm" class="tl"><div class="tmy" id="tmy"></div><input type="range" id="tmr"><div class="tmc" id="tmc"></div><div id="tmo"></div></div>
<div id="ct" class="tl"></div>
<div id="hk" class="tl"></div>
<div id="sl" class="tl"></div>
<div id="kh" class="tl"></div>
<div id="nt" class="tl"></div><div id="gt" class="tl"></div><div id="ap" class="tl"></div>
<div id="cd" class="tl"><div class="lbl" style="margin-top:0">لمن تريد البطاقة؟</div><select id="cws"></select><div class="lbl">المناسبة</div><select id="cwo"></select><div class="lbl">اللون</div><div class="sw" id="cwc"></div><div class="lbl">سطر خاص (اختياري)</div><input id="cwt" maxlength="60" placeholder="مثال: ألف مبروك يا عمّي"><button id="cwb" class="go">🎁 صنع البطاقة</button></div>
</main>
<div id="shade"></div>
<div id="sheet" role="dialog" aria-modal="true"><div class="top"><div id="sav"></div><div><h2 id="sn"></h2><p id="sr"></p></div></div><p id="sx"></p><p id="sb"></p><p id="sa"></p><p id="sc"></p><button id="close">إغلاق</button></div>
<div class="zv" id="zv"><button id="zx" aria-label="إغلاق">✕</button><img id="zi" alt="شجرة العائلة"></div>
<div class="cv" id="cv"><img id="cimg" alt="بطاقة تهنئة"><div class="cb"><button id="csave">حفظ</button><button id="cshare">مشاركة</button><button id="cclose">إغلاق</button></div><p id="chint">اضغط مطولًا على الصورة لحفظها</p></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
